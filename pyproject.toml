[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsn"
version = "0.3.12"
description = "Mode-aware KV cache quantization for Pre-LN Transformers. v0.3 asymmetric per-channel INT3 at 3.0 bits/value achieves WikiText-2 production tier (<5% baseline ΔPPL) on 8 of 8 benchmarked models spanning 2021-2026, with 5.09x real-packed compression. Four-method ablation confirms every component of the recipe (norm separation, per-channel scaling, asymmetric window) is empirically necessary; no simpler ablation hits production tier universally. Data-independent, no calibration, 10-line implementation."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kentaro Sato", email = "info@metaclan.jp"},
]
keywords = ["quantization", "kv-cache", "llm", "int3", "int4", "transformers", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
eval = ["transformers>=4.40", "datasets", "accelerate", "hf_transfer"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/metaSATOKEN/nsn"
Repository = "https://github.com/metaSATOKEN/nsn"
Issues = "https://github.com/metaSATOKEN/nsn/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nsn = ["py.typed"]
